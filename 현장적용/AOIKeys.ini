; WISVision IM AOI Keys
; 경로: C:\WISVision\Config\AOIKeys.ini
; 한 줄: 동작=키   (여러 키는 콤마)
; 주석: ; 또는 #
; 키 예: F5, Enter, Escape, Space, Left, D1, NumPad1, Ctrl+F5

[AOIKeys]
; 운전
Start=F5
Stop=Escape
Pause=F6
Auto=F4
Manual=F3

; 촬상 / 정렬
Grab=F2
Live=F1
Align=A

; 판정
OK=Enter
NG=Space
Retry=R
Skip=S

; 맵 이동
Next=Right
Prev=Left
NextRow=Down
PrevRow=Up
Home=Home

; 저장 / 레시피
Save=F9
Recipe=F10

; 불량 코드 1~9 (숫자키 + 키패드)
Class1=D1,NumPad1
Class2=D2,NumPad2
Class3=D3,NumPad3
Class4=D4,NumPad4
Class5=D5,NumPad5
Class6=D6,NumPad6
Class7=D7,NumPad7
Class8=D8,NumPad8
Class9=D9,NumPad9
